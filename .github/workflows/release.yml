name: Release

on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute tags
        id: meta
        run: echo "major=${GITHUB_REF_NAME%%.*}" >> "$GITHUB_OUTPUT"
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/crystal-actions/hall-of-fame:${{ github.ref_name }}
            ghcr.io/crystal-actions/hall-of-fame:${{ steps.meta.outputs.major }}
            ghcr.io/crystal-actions/hall-of-fame:latest

      # The image must exist before the moving major tag points at a commit
      # whose action.yml references it.
      - name: Move major version tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "${{ steps.meta.outputs.major }}"
          git push origin "${{ steps.meta.outputs.major }}" --force
